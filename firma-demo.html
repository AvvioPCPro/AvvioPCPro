<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>AvvioPC Pro - Signature</title>
    <style>
        /* Blocco totale gesture e scroll nativi */
        body, html { 
            margin: 0; padding: 0; 
            width: 100%; height: 100%; 
            background: #222; color: #333; 
            font-family: Arial, sans-serif; 
            overflow: hidden; touch-action: none; 
        }

        /* Motore di rotazione matematica */
        #app-wrapper {
            position: absolute;
            top: 0; left: 0;
            background: #f4f4f9;
            box-sizing: border-box;
            display: flex;
            padding: 15px;
        }

        .card { 
            background: #fff; border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.3); 
            width: 100%; height: 100%; 
            box-sizing: border-box;
            display: flex; flex-direction: column;
            padding: 20px;
        }

        #disclaimer-section { justify-content: center; align-items: center; text-align: center; }
        .text-content { flex: 1; display: flex; flex-direction: column; justify-content: center; }
        
        h2 { color: #0056b3; font-size: 1.6em; margin: 0 0 10px 0; text-align: center; }
        p { font-size: 1.1em; line-height: 1.5; color: #444; margin: 0 0 15px 0; }

        .btn-group { display: flex; gap: 15px; flex: 0 0 auto; width: 100%; margin-top: 15px; }
        .btn { 
            flex: 1; padding: 16px; font-size: 1.2em; font-weight: bold;
            border: none; border-radius: 30px; cursor: pointer; color: white;
        }
        .btn-primary { background: #0056b3; }
        .btn-success { background: #28a745; }
        .btn-danger { background: #dc3545; }
        .btn:disabled { background: #aaa; cursor: not-allowed; }

        #signature-section { display: none; } 
        
        /* Contenitore privo di padding per misure perfette */
        .canvas-container {
            flex: 1; 
            border: 2px dashed #0056b3; 
            border-radius: 8px;
            background: #fff;
            margin-top: 10px;
            overflow: hidden;
            display: flex;
        }
        
        /* Nessuna dimensione CSS! La dimensione la inietta il JS in modo esatto */
        canvas { 
            display: block;
            touch-action: none;
            cursor: crosshair;
        }
    </style>
</head>
<body>

    <div id="app-wrapper">
        <!-- DISCLAIMER SECTION -->
        <div id="disclaimer-section" class="card">
            <div class="text-content">
                <h2>Informativa Privacy</h2>
                <p>Il/la sottoscritto/a acconsente al trattamento dei dati personali per le finalità richieste dal servizio di configurazione software, ovvero di backup e trasferimento dati, erogato come da specifiche tecniche.</p>
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="showSignaturePad()">Ho letto e accetto</button>
            </div>
        </div>

        <!-- SIGNATURE SECTION -->
        <div id="signature-section" class="card">
            <h2>Apporre la propria firma qui sotto</h2>
            
            <div class="canvas-container">
                <canvas id="sigCanvas"></canvas>
            </div>
            
            <div class="btn-group">
                <button class="btn btn-danger" onclick="clearCanvas()">Cancella</button>
                <button id="btnConfirm" class="btn btn-success" onclick="saveDemo()" disabled>Conferma</button>
            </div>
        </div>
    </div>

    <script>
        const wrapper = document.getElementById('app-wrapper');
        const canvas = document.getElementById('sigCanvas');
        const ctx = canvas.getContext('2d');
        const btnConfirm = document.getElementById('btnConfirm');
        
        let isDrawing = false;
        let hasDrawn = false; 
        let isRotated = false;
        let cachedRect = null; // Memorizza la posizione per evitare calcoli lenti durante il tocco

        // Applica l'orientamento corretto forzando il landscape
        function applyOrientation() {
            const w = window.innerWidth;
            const h = window.innerHeight;

            if (h > w) {
                isRotated = true;
                wrapper.style.width = h + 'px';
                wrapper.style.height = w + 'px';
                wrapper.style.transformOrigin = 'top left';
                wrapper.style.transform = `translate(${w}px, 0) rotate(90deg)`;
            } else {
                isRotated = false;
                wrapper.style.width = w + 'px';
                wrapper.style.height = h + 'px';
                wrapper.style.transform = 'none';
            }
        }

        window.addEventListener('resize', applyOrientation);
        applyOrientation();

        function showSignaturePad() {
            document.getElementById('disclaimer-section').style.display = 'none';
            document.getElementById('signature-section').style.display = 'flex';
            
            // Aspetta un istante che il browser disegni effettivamente il layout a schermo
            setTimeout(() => {
                const container = document.querySelector('.canvas-container');
                // Allinea la risoluzione del canvas ESATTAMENTE ai pixel del contenitore
                canvas.width = container.clientWidth;
                canvas.height = container.clientHeight;
                clearCanvas();
            }, 100);
        }

        // Il cuore del sistema Zero-Drift: mappa i pixel 1:1 senza moltiplicatori
        function getPointerPos(e) {
            let screenX = e.clientX;
            let screenY = e.clientY;
            
            if (e.touches && e.touches.length > 0) {
                screenX = e.touches[0].clientX;
                screenY = e.touches[0].clientY;
            }

            if (isRotated) {
                return { 
                    x: screenY - cachedRect.top, 
                    y: cachedRect.right - screenX 
                };
            } else {
                return { 
                    x: screenX - cachedRect.left, 
                    y: screenY - cachedRect.top 
                };
            }
        }

        // --- Logica di Disegno ---
        function startPosition(e) {
            isDrawing = true;
            // Calcoliamo la posizione fisica del canvas sullo schermo nel momento esatto del tocco
            cachedRect = canvas.getBoundingClientRect();
            
            const pos = getPointerPos(e);
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
            draw(e);
        }

        function endPosition() {
            isDrawing = false;
            ctx.beginPath();
        }

        function draw(e) {
            if (!isDrawing) return;
            e.preventDefault(); 
            
            if (!hasDrawn) {
                hasDrawn = true;
                btnConfirm.disabled = false;
            }

            const pos = getPointerPos(e);
            
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#000000';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startPosition);
        canvas.addEventListener('mouseup', endPosition);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseleave', endPosition);
        
        canvas.addEventListener('touchstart', startPosition, { passive: false });
        canvas.addEventListener('touchend', endPosition);
        canvas.addEventListener('touchmove', draw, { passive: false });
        canvas.addEventListener('touchcancel', endPosition);

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hasDrawn = false;
            btnConfirm.disabled = true;
        }

        function saveDemo() {
            alert("Demo: firma acquisita, pronta per criptazione AES e salvataggio sul Google Sheet.");
            location.reload(); 
        }
    </script>
</body>
</html>
